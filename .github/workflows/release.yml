name: Release

# Merging the bump PR is the release. This checks whether the version in
# package.json is already on npm and publishes if it is not, which is the same
# pattern tileserver-gl and maplibre-maui-ac use — no separate "create a GitHub
# Release" step to remember, and re-running on an unchanged version is a no-op.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # to tag the published commit
  id-token: write # OIDC, for npm trusted publishing and provenance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    name: Check if version is published
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true

      - name: Check if version is published
        id: check
        env:
          PACKAGE: pmtiles-swarm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # `npm view … versions --json` returns an array, but a bare string
          # when the package has exactly one version, and nothing at all when it
          # does not exist yet. Node handles all three; jq quietly gets the
          # single-version case wrong and would republish an existing version.
          PUBLISHED="$(npm view "$PACKAGE" versions --json 2>/dev/null | node -e '
            let raw = "";
            process.stdin.on("data", (d) => (raw += d)).on("end", () => {
              let versions;
              try { versions = JSON.parse(raw); } catch { versions = []; }
              if (!Array.isArray(versions)) versions = versions ? [versions] : [];
              process.stdout.write(versions.includes(process.argv[1]) ? "true" : "false");
            });
          ' "$VERSION")"
          [ -n "$PUBLISHED" ] || PUBLISHED=false
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "version: $VERSION | already published: $PUBLISHED"

  publish:
    name: Publish to npm
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    runs-on: ubuntu-latest
    # Matches the trusted-publisher configuration on npmjs.com: npm rejects the
    # OIDC token unless the workflow ran in this environment, so a workflow
    # edited on another branch cannot publish. Protection rules attach here.
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Setup node env 📦
        uses: actions/setup-node@v6
        with:
          # Pinned rather than read from engines.node: trusted publishing needs
          # npm 11.5.1+, which ships with Node 22.14+.
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # No typecheck or build step: this package is plain ESM and ships its
      # source. The workflow was adapted from pmtiles-torrent, which is
      # TypeScript and has both — running them here failed with
      # `Missing script: "tsc"`, which would have taken down the first real
      # release.
      - name: Test
        run: npm test

      - name: Ensure npm supports trusted publishing
        run: |
          # Trusted publishing exchanges the workflow's OIDC token for
          # short-lived credentials, and needs npm 11.5.1 or newer. Older npm
          # ignores the token and then fails on missing auth, which is a
          # confusing way to discover the version is wrong.
          #
          # Compared without semver, which is not a dependency here: reading it
          # through require() always threw, so the fallback always ran and this
          # step reinstalled npm on every release whatever version it had.
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          OLDEST="$({ echo 11.5.1; echo "$NPM_VERSION"; } | sort -V | head -n1)"
          if [ "$OLDEST" != "11.5.1" ]; then
            echo "npm $NPM_VERSION is older than 11.5.1; upgrading"
            npm install -g npm@latest
          fi

      - name: Choose dist-tag
        id: disttag
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          # A version carrying a prerelease identifier must not become "latest",
          # or everyone installing the package gets it by default.
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # No NODE_AUTH_TOKEN: authentication comes from the OIDC token above,
        # via the trusted publisher registered for this repo and workflow on
        # npmjs.com.
        run: npm publish --access public --provenance --tag ${{ steps.disttag.outputs.tag }}

      - name: Tag and release
        # After publishing, so a failure here leaves a published package
        # without a tag rather than a tag pointing at nothing.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          # The release notes are the changelog section for this version.
          #
          # Same extraction tileserver-gl-wdb and maplibre-maui-ac use (awk
          # from the matching "## <version>" heading to the next one), so a
          # reader gets what changed rather than a line saying it was
          # published. Those repositories reach GitHub through
          # ncipollo/release-action; this uses the gh CLI already installed on
          # the runner, which needs no third-party action to be trusted.
          awk -v ver="## $VERSION" '
            BEGIN { p = 0 }
            $0 == ver { p = 1; next }
            /^## / && p == 1 { exit }
            p == 1 { print }
          ' CHANGELOG.md > release-notes.md

          # A version with no section is a mistake worth seeing in the release
          # rather than a reason to fail after the package is already on npm.
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $VERSION." > release-notes.md
          fi
          cat release-notes.md

          FLAGS=""
          case "$VERSION" in
            *-*) FLAGS="--prerelease" ;;
          esac
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md $FLAGS
