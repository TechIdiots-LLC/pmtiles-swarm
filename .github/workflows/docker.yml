name: Docker

# Separate from the release workflow on purpose. Publishing to npm and building
# images are different failures with different fixes, and an image build that
# breaks must not be able to fail a publish that already succeeded — or, worse,
# leave a half-done release that cannot be re-run because npm already has the
# version.
#
# Runs when the release workflow publishes a GitHub Release, which it does
# after npm. Also runnable by hand, for rebuilding an image against a fixed
# base without cutting a version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, without the leading v
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    environment: release

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than QEMU. An emulated arm64 build of a
          # Node image is minutes of CPU for the same result.
          - runs-on: ubuntu-24.04
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          # A dispatch says which; a release says so in its tag. Either way the
          # image is built from this checkout, so the tag and the contents
          # agree by construction.
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The package is the authority. A tag that disagrees with it would
          # publish an image whose name is a lie about what is inside it.
          PACKAGE="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE" ]; then
            echo "tag says $VERSION but package.json says $PACKAGE" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: wifidb/pmtiles-swarm:v${{ steps.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Is this a prerelease?
        id: kind
        run: |
          # A prerelease must not become `latest`. Somebody pulling that tag is
          # asking for the version to run in production, not the one to try.
          VERSION="${{ steps.version.outputs.version }}"
          case "$VERSION" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "latest=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create and push the manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE=wifidb/pmtiles-swarm

          TAGS="--tag ${IMAGE}:v${VERSION}"
          if [ "${{ steps.kind.outputs.latest }}" = "true" ]; then
            TAGS="$TAGS --tag ${IMAGE}:latest"
          fi

          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS \
            "${IMAGE}:v${VERSION}-amd64" \
            "${IMAGE}:v${VERSION}-arm64"

      - name: Show what was published
        run: docker buildx imagetools inspect wifidb/pmtiles-swarm:v${{ steps.version.outputs.version }}
