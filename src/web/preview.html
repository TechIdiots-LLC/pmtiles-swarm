<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — pmtiles-swarm</title>
    <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css" />
    <link rel="stylesheet" href="/vendor/maplibre-gl-inspect/maplibre-gl-inspect.css" />
    <style>
      :root {
        --bg: #12141a;
        --panel: #1a1d26;
        --line: #2a2f3d;
        --fg: #e6e8ee;
        --muted: #8b93a7;
        --accent: #4f7cff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 0.8rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex-wrap: wrap;
      }
      header h1 { font-size: 1rem; margin: 0; }
      header .sub { color: var(--muted); font-size: 0.8rem; }
      header code { font-size: 0.75rem; color: var(--muted); }
      header .links { margin-left: auto; display: flex; gap: 0.9rem; }
      header a { color: var(--accent); font-size: 0.8rem; }
      #map { flex: 1; min-height: 0; }
      .banner {
        margin: auto;
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
        color: var(--muted);
      }
      /* The inspect legend is written for a light page. */
      .maplibregl-ctrl-inspect .maplibregl-ctrl-inspect-legend,
      .maplibregl-ctrl-inspect-legend {
        background: var(--panel);
        color: var(--fg);
      }
      #note {
        padding: 0.7rem 1rem;
        border-bottom: 1px solid var(--line);
        background: #2a2410;
        color: #e8d9a0;
        font-size: 0.85rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="name">Loading…</h1>
      <span class="sub" id="summary"></span>
      <code id="endpoint"></code>
      <span class="links">
        <a id="mode" href="#" hidden></a>
        <a id="back" href="/">← console</a>
      </span>
    </header>
    <div id="note" hidden></div>
    <div id="map"></div>

    <script type="module">
      // A namespace import, not a default one: MapLibre's ESM build exports
      // Map, Popup and the controls by name and has no default export at all.
      // Importing a default that is not there is a SyntaxError before a line
      // of this runs, so the page shows nothing but "Loading…".
      import * as maplibregl from '/vendor/maplibre-gl/maplibre-gl.mjs';
      import MaplibreInspect from '/vendor/maplibre-gl-inspect/maplibre-gl-inspect.mjs';

      // Derived from wherever this page is served rather than assembled from
      // an infohash, so one page previews both an archive and a category:
      //   /archives/<infohash>/preview  ->  /archives/<infohash>/tiles.json
      //   /latest/<category>/preview    ->  /latest/<category>/tiles.json
      // The second is the one worth having, because it is what a style should
      // actually point at — it follows the newest build instead of pinning to
      // the one that happened to be current when the link was made.
      const tileJsonUrl = location.pathname.replace(
        /\/preview\/?$/,
        '/tiles.json',
      );
      const $ = (id) => document.getElementById(id);

      // Back to the view this was opened from rather than to whatever the
      // console opens on. The path already says which: a stack was reached
      // from Stacks, a category from Categories, an archive from the list.
      const back = $('back');
      if (back) {
        back.href = location.pathname.startsWith('/stacks/')
          ? '/#stacks'
          : location.pathname.startsWith('/latest/')
            ? '/#categories'
            : '/';
      }

      const fail = (message) => {
        document.body.innerHTML = `<div class="banner">${message}</div>`;
      };

      let tilejson;
      try {
        const response = await fetch(tileJsonUrl);
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error ?? `the TileJSON answered ${response.status}`);
        }
        tilejson = await response.json();
      } catch (error) {
        fail(error.message);
        throw error;
      }

      const vectorLayers = tilejson.vector_layers ?? [];
      const vector =
        vectorLayers.length > 0 || /\.(pbf|mvt)(\?|$)/.test(tilejson.tiles?.[0] ?? '');

      // The encodings MapLibre can read as a raster-dem source. Named rather
      // than tested as "encoding is set", because `mlt` travels in the same
      // field and is a vector format -- treating it as terrain would render a
      // hillshade of nothing.
      const TERRAIN = ['terrarium', 'mapbox', 'custom'];
      const FACTORS = ['redFactor', 'greenFactor', 'blueFactor', 'baseShift'];
      // `custom` is unreadable without all four, so an archive that declares it
      // and carries none is not terrain this page can draw.
      const terrainReady =
        !vector &&
        TERRAIN.includes(tilejson.encoding) &&
        (tilejson.encoding !== 'custom' ||
          FACTORS.every((name) => Number.isFinite(tilejson[name])));
      // Terrain by default where there is terrain: a terrain-RGB archive drawn
      // as an ordinary raster is a psychedelic mess that says nothing about the
      // ground. The raw tiles stay one click away, because they are what shows
      // a hole in the data -- a missing tile reads as flat, not as missing.
      const asked = new URLSearchParams(location.search);
      const raw = asked.has('raw');
      // Offered wherever there is terrain. The endpoint sits beside the
      // preview for all three -- a stack, one archive, and whichever build a
      // category points at -- so the source URL below is the same rewrite in
      // every case.
      const contours = asked.has('contours') && terrainReady;
      const terrain = terrainReady && !raw;

      $('name').textContent = tilejson.name ?? tileJsonUrl;
      $('summary').textContent =
        `${vector ? 'vector' : 'raster'} · z${tilejson.minzoom ?? 0}–${tilejson.maxzoom ?? 14}` +
        (vector
          ? vectorLayers.length > 0
            ? ` · ${vectorLayers.length} layers`
            : ' · no layer list yet'
          : terrainReady
            ? ` · ${tilejson.encoding} terrain`
            : '');
      $('endpoint').textContent = tilejson.tiles?.[0] ?? '';

      // One source, described entirely by the archive's own TileJSON. That
      // endpoint is already a complete, valid source description, so there is
      // nothing to reconstruct here — which is most of the reason it is worth
      // having.
      /**
       * The archive as a DEM source, described by its own TileJSON.
       * @returns {object} - A raster-dem source.
       */
      const demSource = () => ({
        type: 'raster-dem',
        url: tileJsonUrl,
        encoding: tilejson.encoding,
        ...(tilejson.encoding === 'custom'
          ? Object.fromEntries(FACTORS.map((name) => [name, tilejson[name]]))
          : {}),
      });

      const style = terrain
        ? {
            version: 8,
            // Two sources over one URL, which is what MapLibre's own terrain
            // example does and what tileserver-gl ships. Terrain and hillshade
            // ask a DEM source for different things -- one is sampled for
            // height across the whole viewport, the other is shaded per tile --
            // and sharing one source between them has a history of rendering
            // artefacts. The tiles are requested once either way: the HTTP
            // cache answers the second source.
            sources: { terrain: demSource(), hillshade: demSource() },
            terrain: { source: 'terrain' },
            layers: [
              {
                id: 'bg',
                type: 'background',
                // Sea, not page furniture. Where a terrain archive has no data
                // it is usually because there is water there.
                paint: { 'background-color': '#16323f' },
              },
              {
                id: 'hillshade',
                type: 'hillshade',
                source: 'hillshade',
                paint: {
                  'hillshade-shadow-color': 'hsl(39, 21%, 33%)',
                  'hillshade-illumination-direction': 315,
                  'hillshade-exaggeration': 0.8,
                },
              },
            ],
          }
        : {
            version: 8,
            sources: {
              archive: { type: vector ? 'vector' : 'raster', url: tileJsonUrl },
            },
            layers: [
              {
                id: 'bg',
                type: 'background',
                paint: { 'background-color': '#12141a' },
              },
            ],
          };
      if (!vector && !terrain) {
        style.layers.push({ id: 'archive', type: 'raster', source: 'archive' });
      }

      // Over whatever is underneath, rather than instead of it: a contour on
      // its own says nothing about which side of it is uphill, and the point
      // of drawing them here is to see them against the ground they came from.
      if (contours) {
        const source = location.pathname.replace(
          /\/preview$/,
          '/contours/{z}/{x}/{y}.pbf',
        );
        style.sources.contours = {
          type: 'vector',
          // Joined to the origin rather than run through `new URL()`, which
          // percent-encodes the braces: `{z}` becomes `%7Bz%7D`, MapLibre
          // never substitutes it, and every request asks the server for a tile
          // at the literal coordinates "{z}". `source` is already an absolute
          // path, so there is nothing to resolve.
          tiles: [location.origin + source],
          // The endpoint answers 404 above and below what its thresholds draw
          // at, which MapLibre reads as an empty tile rather than an error.
          minzoom: 0,
          maxzoom: 16,
        };
        style.layers.push({
          id: 'contours',
          type: 'line',
          source: 'contours',
          'source-layer': 'contours',
          paint: {
            'line-color': 'rgba(255,255,255,0.45)',
            // `level` counts the intervals a height divides by, so the major
            // lines draw themselves without a second layer or a filter.
            'line-width': ['match', ['get', 'level'], 0, 0.6, 1.4],
          },
        });
        // No labels, deliberately. Text needs a glyph server, and a preview
        // that fetched fonts from somewhere else would be a preview of that
        // as much as of the archive. `ele` is on every feature for a style
        // that has fonts to spend.
      }

      // Offered rather than assumed, both ways round. Reading heights off the
      // raw pixels is the only way to see that a tile is present but wrong.
      if (terrainReady) {
        const toggle = $('mode');
        toggle.hidden = false;
        toggle.textContent = terrain ? 'raw tiles →' : 'terrain →';
        toggle.addEventListener('click', (event) => {
          event.preventDefault();
          // Assembled at click time so the hash, which is where the map keeps
          // the position it is currently showing, survives the reload.
          //
          // The contour flag rides along, because it is a thing drawn *over*
          // the terrain rather than a mode instead of it -- switching to raw
          // tiles and losing the lines would be answering a different question
          // than the one that was asked.
          const flags = [terrain ? 'raw=1' : '', contours ? 'contours=1' : '']
            .filter(Boolean)
            .join('&');
          location.href =
            location.pathname + (flags ? `?${flags}` : '') + location.hash;
        });
      }

      // An archive that says `custom` and carries none of the four factors
      // cannot be read as heights by anything, this page included.
      if (!vector && tilejson.encoding === 'custom' && !terrainReady) {
        $('note').hidden = false;
        $('note').textContent =
          'This archive declares the custom terrain encoding but not the four ' +
          'factors it is unreadable without — redFactor, greenFactor, ' +
          'blueFactor and baseShift. It is drawn as an ordinary raster, which ' +
          'is the only honest thing to do with pixels whose meaning is not ' +
          'stated.';
      }

      // An archive whose metadata has not been read yet cannot be drawn: a
      // vector style needs `source-layer` names, and nothing in a tile request
      // supplies them. Say so, rather than presenting a black rectangle.
      if (vector && vectorLayers.length === 0) {
        $('note').hidden = false;
        $('note').textContent =
          'This archive has not reported its vector layers yet, so there is ' +
          'nothing to style. In a PMTiles file the layer list lives in a ' +
          'metadata block that some writers put after every tile, so on a ' +
          'partial download it is among the last bytes to arrive. The node is ' +
          'fetching it from the swarm in the background — reload in a minute.';
      }

      const map = new maplibregl.Map({
        container: 'map',
        style,
        center: tilejson.center?.slice(0, 2) ?? [0, 0],
        zoom: tilejson.center?.[2] ?? 2,
        maxZoom: (tilejson.maxzoom ?? 14) + 2,
        // 60 is the default and it is not enough to see relief: the whole
        // point of the terrain view is looking across a landscape rather than
        // down at it.
        ...(terrain ? { maxPitch: 85 } : {}),
        hash: true,
      });
      map.addControl(
        new maplibregl.NavigationControl({ visualizePitch: terrain }),
        'top-left',
      );
      map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

      if (terrain) {
        // Terrain off is a useful view of a DEM in its own right -- hillshade
        // flat on the screen is easier to compare against a map than a
        // perspective is -- so this stays a switch rather than being set once.
        map.addControl(
          new maplibregl.TerrainControl({ source: 'terrain' }),
          'top-left',
        );
      }

      if (vector) {
        // MapLibre's own inspect control, rather than something equivalent
        // written here: it is maintained alongside the renderer, so it keeps
        // working across major versions without this having to notice.
        //
        // The source layers are handed over from the TileJSON when it has any,
        // because that draws the legend immediately and on an archive read out
        // of a swarm the first tile can be seconds away. Passing them also
        // switches the control's own lookup off, so the empty list from an
        // archive with no `vector_layers` is not passed at all.
        //
        // `showInspectMap: true` sets a flag and nothing else — it does not
        // draw. The control renders from exactly two places: a source-change
        // handler it only subscribes to when `sources` was *not* passed, and
        // the toggle button's click. Passing sources closes the first and
        // hiding the button closes the second, and doing both leaves nothing
        // that ever calls render(). Hence the explicit call below.
        const inspect = new MaplibreInspect({
            showInspectMap: true,
            showInspectButton: false,
            showInspectMapPopup: true,
            blockHoverPopupOnClick: true,
            backgroundColor: '#12141a',
            ...(vectorLayers.length > 0
              ? { sources: { archive: vectorLayers.map((layer) => layer.id) } }
              : {}),
            // Passed in rather than left to a default: the control does not
            // import maplibre-gl at runtime, so it cannot make one itself.
            popup: new maplibregl.Popup({
              closeButton: true,
              closeOnClick: false,
              maxWidth: '32rem',
            }),
        });
        map.addControl(inspect);

        // After load, so the control has captured the original style and the
        // style it builds from has its sources in it.
        map.on('load', () => inspect.render());
      }

      map.on('error', (event) => {
        // Worth surfacing rather than swallowing: a tile that will not load
        // usually means the swarm has not found that piece yet, and silence
        // reads as an empty map.
        console.warn('[preview]', event.error?.message ?? event);
      });

      map.once('load', () => {
        const bounds = tilejson.bounds ?? [-180, -85, 180, 85];
        if (!location.hash) {
          map.fitBounds(
            [
              [bounds[0], bounds[1]],
              [bounds[2], bounds[3]],
            ],
            { padding: 20, animate: false },
          );
        }
      });
    </script>
  </body>
</html>
