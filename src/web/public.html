<!doctype html>
<!--
  The public front door, served at / on the public listener when the console
  has an admin port of its own.

  Reads /latest/ for the categories and, for the archives, /api/catalog where a
  credential allows it and /feed.xml where one does not — everything under /api/
  is guarded on a node with any authentication configured, which is most of them,
  and a front page that answers 401 to its own audience is worse than none.

  All three are filtered by feedCategories, so this page shows exactly what the
  node publishes and cannot show anything else. It is deliberately plain: no
  build step, no dependencies, and it degrades to a readable list of links if the
  script does not run.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map archives</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #5c6370;
        --line: #dfe3ea;
        --card: #f7f8fa;
        --accent: #1c6fd6;
        --code: #eef1f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --fg: #e6e8ec;
          --muted: #9aa2b1;
          --line: #2b2f37;
          --card: #1b1e24;
          --accent: #6fb2ff;
          --code: #22262e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.55 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      main {
        max-width: 62rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 2rem;
      }
      h2 {
        font-size: 1.05rem;
        margin: 2.5rem 0 0.75rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: var(--accent);
      }
      code,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.86em;
      }
      .archive {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      .archive header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.75rem;
        align-items: baseline;
        margin-bottom: 0.5rem;
      }
      .name {
        font-weight: 600;
        word-break: break-all;
      }
      .facts {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 0.6rem;
      }
      .tag {
        display: inline-block;
        padding: 0.05rem 0.45rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.9rem;
        font-size: 0.9rem;
      }
      .urls {
        margin-top: 0.7rem;
        display: grid;
        gap: 0.3rem;
      }
      .urls div {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .urls span {
        color: var(--muted);
        min-width: 5.5rem;
        font-size: 0.82rem;
      }
      .urls code {
        background: var(--code);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        word-break: break-all;
      }
      .empty,
      .failed {
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 1.5rem;
        text-align: center;
      }
      footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
      }
      noscript {
        display: block;
        margin-bottom: 1.5rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 0.9rem;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      .toolbar input[type='search'] {
        flex: 1 1 18rem;
        min-width: 0;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      .toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .toolbar select {
        padding: 0.35rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      .count {
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Map archives</h1>
      <p class="lede">
        Tile archives published by this node, over HTTP and over BitTorrent.
      </p>

      <noscript>
        <p class="failed">
          This page lists the archives using JavaScript. Without it, the same
          information is at <a href="/latest/">/latest/</a> as JSON and
          <a href="/feed.xml">/feed.xml</a> as RSS.
        </p>
      </noscript>

      <div class="toolbar" id="toolbar" hidden>
        <input
          type="search"
          id="filter"
          placeholder="Filter by name or category…"
          autocomplete="off"
          spellcheck="false"
        />
        <label>
          Sort
          <select id="sort">
            <option value="name">name</option>
            <option value="newest">newest first</option>
            <option value="largest">largest first</option>
          </select>
        </label>
        <span class="count" id="count"></span>
      </div>

      <div id="categories"></div>
      <div id="archives"><p class="empty">Loading…</p></div>

      <footer>
        <a href="/latest/">categories JSON</a> ·
        <a href="/feed.xml">RSS feed</a> ·
        <a href="/health">health</a>
      </footer>
    </main>

    <script type="module">
      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const bytes = (n) => {
        if (!Number.isFinite(n) || n <= 0) return null;
        const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
        let value = n;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit += 1;
        }
        return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
      };

      // A row of "label: copyable URL". The URLs are the point of the page, so
      // they are shown in full rather than hidden behind link text.
      const urlRow = (label, url) => {
        const row = el('div');
        row.append(el('span', null, label));
        const code = el('code', null, url);
        row.append(code);
        return row;
      };

      const render = (archives) => {
        const host = document.getElementById('archives');
        host.textContent = '';
        if (archives.length === 0) {
          host.append(
            el('p', 'empty', 'This node is not publishing any archives yet.'),
          );
          return;
        }

        for (const archive of archives) {
          const card = el('div', 'archive');
          const head = el('header');
          head.append(el('span', 'name', archive.name ?? archive.infoHash));
          for (const category of archive.categories ?? []) {
            head.append(el('span', 'tag', category));
          }
          card.append(head);

          const facts = [];
          const size = bytes(archive.size);
          if (size) facts.push(size);
          const summary = archive.pmtiles;
          if (summary?.format) facts.push(summary.format);
          if (Number.isFinite(summary?.minZoom)) {
            facts.push(`z${summary.minZoom}–${summary.maxZoom}`);
          }
          if (archive.createdAt) {
            facts.push(new Date(archive.createdAt).toISOString().slice(0, 10));
          }
          if (facts.length > 0) card.append(el('p', 'facts', facts.join(' · ')));

          const root = `/archives/${archive.infoHash}`;
          const links = el('div', 'links');
          const add = (href, text) => {
            const a = el('a', null, text);
            a.href = href;
            links.append(a);
          };

          // Only PMTiles and a completed MBTiles have a tile endpoint, and the
          // catalogue says which kind this is — so a link that would answer 415
          // is not offered at all.
          const servable = !archive.kind || archive.kind !== 'unknown';
          if (servable) {
            add(`${root}/tiles.json`, 'TileJSON');
            add(`${root}/preview`, 'preview');
          }
          add(`${root}/archive.torrent`, '.torrent');
          if (archive.magnet) add(archive.magnet, 'magnet');
          card.append(links);

          const urls = el('div', 'urls');
          if (servable) {
            urls.append(urlRow('TileJSON', new URL(`${root}/tiles.json`, location.href).href));
          }
          for (const seed of archive.webSeeds ?? []) {
            urls.append(urlRow('web seed', seed));
          }
          if (urls.childElementCount > 0) card.append(urls);

          host.append(card);
        }
      };

      // Categories are the handle that survives a rebuild, so they go first —
      // a style should point at one of these rather than at an infohash.
      // Categories first, and given the same weight as an archive, because
      // for most visitors they are the more useful thing: an archive URL names
      // one build and goes stale on the next, while a category names whichever
      // is current and keeps working across rebuilds. A style should point at
      // one of these.
      const renderCategories = (categories) => {
        const host = document.getElementById('categories');
        host.textContent = '';
        const usable = categories.filter((c) => c.endpoints);
        if (usable.length === 0) return;

        host.append(el('h2', null, 'Categories'));
        host.append(
          el(
            'p',
            'facts',
            'These follow the newest build. Point a style at one of these ' +
              'rather than at an archive below, and it keeps working when the ' +
              'archive is rebuilt.',
          ),
        );

        for (const entry of usable) {
          // `category` and `archives` are what the endpoint actually calls
          // these; `name` and `count` would read better and are not there.
          const card = el('div', 'archive');
          const head = el('header');
          head.append(el('span', 'name', entry.category));
          if (Number.isFinite(entry.archives)) {
            head.append(
              el(
                'span',
                'tag',
                `${entry.archives} build${entry.archives === 1 ? '' : 's'}`,
              ),
            );
          }
          card.append(head);

          if (entry.newest?.name) {
            const facts = [`newest: ${entry.newest.name}`];
            const size = bytes(entry.newest.size);
            if (size) facts.push(size);
            card.append(el('p', 'facts', facts.join(' · ')));
          }

          const links = el('div', 'links');
          const add = (href, text) => {
            const a = el('a', null, text);
            a.href = href;
            links.append(a);
          };
          const ends = entry.endpoints;
          if (ends.tileJson) add(ends.tileJson, 'TileJSON');
          // The newest build's preview, which is what "show me this
          // category" means.
          if (ends.preview) add(ends.preview, 'preview');
          if (ends.torrent) add(ends.torrent, '.torrent');
          if (ends.magnet) add(ends.magnet, 'magnet');
          if (ends.feed) add(ends.feed, 'RSS');
          card.append(links);

          const urls = el('div', 'urls');
          // The one worth copying: the TileJSON URL with the magnet in its
          // fragment, which a plain client fetches over HTTP and a swarm-aware
          // one joins directly.
          if (ends.styleUrl) {
            urls.append(
              urlRow('style URL', new URL(ends.styleUrl, location.href).href),
            );
          } else if (ends.tileJson) {
            urls.append(
              urlRow('TileJSON', new URL(ends.tileJson, location.href).href),
            );
          }
          if (urls.childElementCount > 0) card.append(urls);

          host.append(card);
        }

        host.append(el('h2', null, 'Archives'));
      };
      const PMTILES_NS =
        'https://github.com/TechIdiots-LLC/pmtiles-swarm/ns/1.0';

      // The feed says the same things the catalog does, in RSS. It is the
      // fallback because it is the one that needs no credential: /api/catalog
      // is guarded whenever this node has any authentication configured, which
      // is most of them, and a front page that 401s is worse than none.
      const fromFeed = (xmlText) => {
        const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
          throw new Error('the feed is not valid XML');
        }

        const text = (item, name) =>
          item.getElementsByTagNameNS(PMTILES_NS, name)[0]?.textContent ??
          undefined;

        return [...doc.getElementsByTagName('item')].map((item) => {
          const zoom = (name) => {
            const value = Number(text(item, name));
            return Number.isFinite(value) ? value : undefined;
          };
          const enclosure = item.getElementsByTagName('enclosure')[0];
          const format = text(item, 'format');

          return {
            infoHash: text(item, 'infohash'),
            name: item.getElementsByTagName('title')[0]?.textContent,
            size: Number(enclosure?.getAttribute('length')) || undefined,
            categories: [...item.getElementsByTagName('category')].map(
              (node) => node.textContent,
            ),
            magnet: text(item, 'magnet'),
            createdAt: item.getElementsByTagName('pubDate')[0]?.textContent,
            pmtiles: format
              ? {
                  format,
                  minZoom: zoom('minzoom'),
                  maxZoom: zoom('maxzoom'),
                }
              : undefined,
          };
        });
      };

      // Held so the filter and the sort re-render from memory rather than
      // asking the node again on every keystroke.
      let loadedArchives = [];
      let loadedCategories = [];

      const matches = (text, needle) =>
        String(text ?? '')
          .toLowerCase()
          .includes(needle);

      const sorters = {
        name: (a, b) => String(a.name ?? '').localeCompare(String(b.name ?? '')),
        newest: (a, b) =>
          new Date(b.createdAt ?? 0) - new Date(a.createdAt ?? 0),
        largest: (a, b) => (b.size ?? 0) - (a.size ?? 0),
      };

      // Re-renders both lists against the current filter and sort.
      const apply = () => {
        const needle = (document.getElementById('filter').value ?? '')
          .trim()
          .toLowerCase();
        const order = document.getElementById('sort').value;

        const archives = loadedArchives
          .filter(
            (archive) =>
              needle === '' ||
              matches(archive.name, needle) ||
              matches(archive.infoHash, needle) ||
              (archive.categories ?? []).some((c) => matches(c, needle)),
          )
          .sort(sorters[order] ?? sorters.name);

        const categories = loadedCategories.filter(
          (entry) =>
            needle === '' ||
            matches(entry.category, needle) ||
            matches(entry.newest?.name, needle),
        );

        renderCategories(categories);
        render(archives);

        const count = document.getElementById('count');
        count.textContent =
          needle === ''
            ? `${loadedArchives.length} archives, ${loadedCategories.length} categories`
            : `${archives.length} of ${loadedArchives.length} archives, ` +
              `${categories.length} of ${loadedCategories.length} categories`;
      };

      const load = async () => {
        let archives = null;

        // Richer where it is reachable: the catalog carries web seeds and the
        // sparse flag, which the feed does not.
        try {
          const response = await fetch('/api/catalog');
          if (response.ok) {
            archives = (await response.json()).archives ?? [];
          }
        } catch {
          // Fall through to the feed.
        }

        if (archives === null) {
          try {
            const response = await fetch('/feed.xml');
            if (!response.ok) throw new Error(`feed said ${response.status}`);
            archives = fromFeed(await response.text());
          } catch (error) {
            const host = document.getElementById('archives');
            host.textContent = '';
            host.append(
              el(
                'p',
                'failed',
                `Could not load the archives: ${error.message}`,
              ),
            );
            return;
          }
        }

        loadedArchives = archives.filter((archive) => archive.infoHash);
        document.getElementById('toolbar').hidden = false;
        apply();

        // /latest/ rather than /api/categories: the same list, without a
        // credential. This is the part most visitors actually want -- an
        // archive URL names one build, a category names whichever is current
        // -- so it is worth more than a best-effort attempt at a guarded
        // endpoint that answers 401 to exactly the audience this page is for.
        try {
          const response = await fetch('/latest/');
          if (response.ok) {
            const body = await response.json();
            loadedCategories = body.categories ?? [];
            apply();
          }
        } catch {
          // Nothing to say. The archives above are the substance.
        }
      };

      document.getElementById('filter').addEventListener('input', apply);
      document.getElementById('sort').addEventListener('change', apply);

      load();
    </script>
  </body>
</html>
