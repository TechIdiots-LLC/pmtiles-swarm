<!doctype html>
<!--
  The public front door, served at / on the public listener when the console
  has an admin port of its own.

  Reads /latest/ for the categories and, for the archives, /api/catalog where a
  credential allows it and /feed.xml where one does not — everything under /api/
  is guarded on a node with any authentication configured, which is most of them,
  and a front page that answers 401 to its own audience is worse than none.

  All three are filtered by feedCategories, so this page shows exactly what the
  node publishes and cannot show anything else. It is deliberately plain: no
  build step, no dependencies, and it degrades to a readable list of links if the
  script does not run.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map archives</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #5c6370;
        --line: #dfe3ea;
        --card: #f7f8fa;
        --accent: #1c6fd6;
        --code: #eef1f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --fg: #e6e8ec;
          --muted: #9aa2b1;
          --line: #2b2f37;
          --card: #1b1e24;
          --accent: #6fb2ff;
          --code: #22262e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.55 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      main {
        max-width: 62rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 2rem;
      }
      h2 {
        font-size: 1.05rem;
        margin: 2.5rem 0 0.75rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: var(--accent);
      }
      code,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.86em;
      }
      .archive {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      .archive header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.75rem;
        align-items: baseline;
        margin-bottom: 0.5rem;
      }
      .name {
        font-weight: 600;
        word-break: break-all;
      }
      .facts {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 0.6rem;
      }
      .tag {
        display: inline-block;
        padding: 0.05rem 0.45rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.9rem;
        font-size: 0.9rem;
      }
      /* A copy button reads as a link's sibling, not as a form control. */
      .copy {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 0.74rem;
        padding: 0 0.45rem;
        cursor: pointer;
      }
      .copy:hover { color: var(--fg); border-color: var(--fg); }
      .copy.done { border-color: currentColor; color: #3fb950; }
      .urls {
        margin-top: 0.7rem;
        display: grid;
        gap: 0.3rem;
      }
      .urls div {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .urls span {
        color: var(--muted);
        min-width: 5.5rem;
        font-size: 0.82rem;
      }
      .urls code {
        background: var(--code);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        word-break: break-all;
      }
      .empty,
      .failed {
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 1.5rem;
        text-align: center;
      }
      footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
      }
      noscript {
        display: block;
        margin-bottom: 1.5rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 0.9rem;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      .toolbar input[type='search'] {
        flex: 1 1 18rem;
        min-width: 0;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      .toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .toolbar select {
        padding: 0.35rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      .count {
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Map archives</h1>
      <p class="lede">
        Tile archives published by this node, over HTTP and over BitTorrent.
      </p>

      <noscript>
        <p class="failed">
          This page lists the archives using JavaScript. Without it, the same
          information is at <a href="/latest/">/latest/</a> as JSON and
          <a href="/feed.xml">/feed.xml</a> as RSS.
        </p>
      </noscript>

      <div class="toolbar" id="toolbar" hidden>
        <input
          type="search"
          id="filter"
          placeholder="Filter by name or category…"
          autocomplete="off"
          spellcheck="false"
        />
        <label>
          Sort
          <select id="sort">
            <option value="name">name</option>
            <option value="newest">newest first</option>
            <option value="largest">largest first</option>
          </select>
        </label>
        <span class="count" id="count"></span>
      </div>

      <div id="categories"></div>
      <div id="stacks"></div>
      <div id="archives"><p class="empty">Loading…</p></div>

      <footer>
        <a href="/categories.xml">category RSS feed</a> ·
        <a href="/feed.xml">archive RSS feed</a> ·
        <a href="/stacks.xml">stack RSS feed</a> ·
        <a href="/health">health</a>
      </footer>
    </main>

    <script type="module">
      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      /** What this page shows in place of a size it has not got. */
      const EMPTY = null;
      /**
       * Formats a byte count for people rather than machines.
       *
       * Kept character-for-character identical to the same helper on the other
       * page, and held there by a test. They drifted once: this one rounded to
       * whole units above ten and the other always kept a decimal, so the same
       * archive read as 81 GiB on one page and 80.6 GiB on the other. Two
       * numbers for one fact is worse than either number.
       *
       * One decimal from KiB up, because these are mostly archive sizes and
       * half a gigabyte of difference is worth seeing.
       */
      const bytes = (n) => {
        if (!Number.isFinite(n) || n <= 0) return EMPTY;
        const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
        let value = n;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit += 1;
        }
        return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
      };

      // A row of "label: copyable URL". The URLs are the point of the page, so
      // they are shown in full rather than hidden behind link text.
      /**
       * Puts text on the clipboard, including where there is no secure context.
       *
       * `navigator.clipboard` requires one. This page is usually reached over
       * HTTPS and so usually has it — but a node answering by IP on a LAN does
       * not, and there the button did nothing but say so. The selection API
       * predates the clipboard API and carries no such requirement, so it
       * works exactly where the other one fails.
       *
       * Deliberately duplicated in index.html rather than shared. Both pages
       * are single files with their script inlined, and one browser shim is a
       * poor reason to give that up.
       * @param {string} text - What to put on the clipboard.
       * @returns {Promise<boolean>} - Whether it landed.
       */
      const toClipboard = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          // Off-screen rather than hidden: an element with `display:none` or
          // `visibility:hidden` cannot hold a selection, so the copy would
          // silently do nothing.
          const field = document.createElement('textarea');
          field.value = text;
          field.setAttribute('readonly', '');
          field.style.position = 'fixed';
          field.style.top = '-1000px';
          document.body.append(field);
          field.select();
          // select() alone is not enough on iOS.
          field.setSelectionRange(0, field.value.length);
          try {
            return document.execCommand('copy');
          } catch {
            return false;
          } finally {
            field.remove();
          }
        }
      };

      const urlRow = (label, url) => {
        const row = el('div');
        row.append(el('span', null, label));
        const code = el('code', null, url);
        row.append(code);
        return row;
      };

      // Same rule the preview applies, so a terrain link is offered on exactly
      // what opens as terrain. `mlt` rides in the same field and is a vector
      // format; `custom` is all four factors or none.
      const drawsAsTerrain = (summary) => {
        const encoding = summary?.encoding;
        if (!['terrarium', 'mapbox', 'custom'].includes(encoding)) return false;
        if (encoding !== 'custom') return true;
        return ['redFactor', 'greenFactor', 'blueFactor', 'baseShift'].every(
          (name) => Number.isFinite(summary?.encodingFactors?.[name]),
        );
      };

      /**
       * A button that copies an address rather than following it.
       *
       * An endpoint belongs somewhere else — a style, a torrent client, a feed
       * reader — and clicking one here achieves nothing. The URL goes in the
       * tooltip either way: a browser on plain HTTP has no clipboard, and
       * something somebody can select beats a button that does nothing.
       * @param {HTMLElement} links - Where to put it.
       * @param {string} href - The address.
       * @param {string} text - What the button says.
       * @param {boolean} [fetched] - Copy what the address answers, not the address.
       * @returns {void}
       */
      const copyButton = (links, href, text, fetched) => {
        const button = el('button', 'copy', text);
        button.type = 'button';
        // `new URL` percent-encodes braces, because they are not legal in a
        // path -- and an XYZ template is very little but braces, so the
        // address copied out of here came back as `%7Bz%7D` and no client
        // would take it. Resolving is still what makes a relative address
        // absolute, so the two sequences it introduces are put back.
        const absolute = new URL(href, location.href).href
          .replaceAll('%7B', '{')
          .replaceAll('%7D', '}');
        button.title = absolute;
        button.onclick = async () => {
          try {
            const value = fetched
              ? (await (await fetch(absolute)).text()).trim()
              : absolute;
            const landed = await toClipboard(value);
            button.classList.toggle('done', landed);
            button.textContent = landed
              ? 'copied'
              : 'copy failed — it is in the tooltip';
            setTimeout(() => {
              button.classList.remove('done');
              button.textContent = text;
            }, 1200);
          } catch {
            button.textContent = 'copy failed — it is in the tooltip';
          }
        };
        links.append(button);
      };

      const render = (archives) => {
        const host = document.getElementById('archives');
        host.textContent = '';
        // Its own heading, in its own section. It used to be appended to the
        // end of the categories block, which put it above anything inserted
        // between the two -- and left it off entirely on a node with no
        // categories, because that renderer returns before reaching it.
        host.append(el('h2', null, 'Archives'));
        if (archives.length === 0) {
          host.append(
            el('p', 'empty', 'This node is not publishing any archives yet.'),
          );
          return;
        }

        for (const archive of archives) {
          const card = el('div', 'archive');
          const head = el('header');
          head.append(el('span', 'name', archive.name ?? archive.infoHash));
          for (const category of archive.categories ?? []) {
            head.append(el('span', 'tag', category));
          }
          card.append(head);

          const facts = [];
          const size = bytes(archive.size);
          if (size) facts.push(size);
          const summary = archive.pmtiles;
          if (summary?.format) facts.push(summary.format);
          if (Number.isFinite(summary?.minZoom)) {
            facts.push(`z${summary.minZoom}–${summary.maxZoom}`);
          }
          if (archive.createdAt) {
            facts.push(new Date(archive.createdAt).toISOString().slice(0, 10));
          }
          if (facts.length > 0) card.append(el('p', 'facts', facts.join(' · ')));

          const root = `/archives/${archive.infoHash}`;
          const links = el('div', 'links');
          const add = (href, text) => {
            const a = el('a', null, text);
            a.href = href;
            links.append(a);
          };

          // The same rule the categories below are built by: an address that
          // belongs somewhere else -- a style, a torrent client, a feed reader
          // -- is copied, and a page or a file is followed. An archive was the
          // odd one out, offering its TileJSON as a link that opens a document
          // nobody reads and then printing the same URL underneath.
          const copy = (href, text, fetched) =>
            copyButton(links, href, text, fetched);

          // Only PMTiles and a completed MBTiles have a tile endpoint, and the
          // catalogue says which kind this is — so a link that would answer 415
          // is not offered at all.
          const servable = !archive.kind || archive.kind !== 'unknown';
          if (servable) {
            copy(`${root}/tiles.json`, 'TileJSON');
            if (drawsAsTerrain(archive.pmtiles)) {
              // The raster keeps the plain name: it is the one that shows a
              // hole, since a missing DEM tile hillshades as flat ground.
              add(`${root}/preview?raw=1`, 'preview');
              add(`${root}/preview`, 'terrain');
            } else {
              add(`${root}/preview`, 'preview');
            }
          }
          // A file, so a link the browser saves rather than renders.
          const torrent = el('a', null, '.torrent');
          torrent.href = `${root}/archive.torrent`;
          torrent.download = '';
          links.append(torrent);
          if (archive.magnet) copy(archive.magnet, 'magnet');
          // Only where the node offers this archive as a download. The
          // catalogue names it rather than the page deciding, because whether
          // a 700 GiB file is advertised to every visitor is the operator's
          // call and not something a page can infer from the file existing.
          if (archive.archive) {
            const download = el('a', null, 'download');
            download.href = archive.archive;
            // Named after the archive rather than after the route, which for
            // every archive on the node is the same word.
            download.download = archive.name ?? '';
            links.append(download);
          }
          // Last, as it is on a category: the one worth copying and the one
          // nobody wants to read. A TileJSON URL carrying the .torrent URL and
          // a percent-encoded magnet in its fragment is several hundred
          // characters, and it is never read, only pasted.
          if (archive.sourceUrl) copy(archive.sourceUrl, 'source URL');
          card.append(links);

          // The TileJSON row that used to head this went with the button that
          // replaced it: printing an address in full beside a button that
          // copies it is the same fact twice, and it was the longest line on
          // the card. What is left has no button of its own.
          const urls = el('div', 'urls');
          if (archive.archive) {
            urls.append(urlRow('archive', archive.archive));
          }
          for (const seed of archive.webSeeds ?? []) {
            urls.append(urlRow('web seed', seed));
          }
          if (urls.childElementCount > 0) card.append(urls);

          host.append(card);
        }
      };

      /**
       * Stacks, which are several archives answering as one endpoint.
       *
       * Listed because a visitor cannot discover one otherwise: a stack has no
       * infohash and appears in no feed, so without this the only way to know a
       * node serves one is to be told its id. What the console shows is a
       * different document — what each source resolved to, what is missing,
       * what cannot be served — and that is the operator's business.
       * @param {object[]} stacks - What `/stacks/` answered with.
       * @returns {void}
       */
      const renderStacks = (stacks) => {
        const host = document.getElementById('stacks');
        host.textContent = '';
        if (stacks.length === 0) return;

        host.append(el('h2', null, 'Stacks'));
        host.append(
          el(
            'p',
            'facts',
            'Several archives served as one endpoint — terrain over ' +
              'bathymetry, or a regional patch over a global base. A stack ' +
              'follows its sources, so it moves when they are rebuilt.',
          ),
        );

        for (const stack of stacks) {
          const card = el('div', 'archive');
          const head = el('header');
          head.append(el('span', 'name', stack.title));
          head.append(el('span', 'tag', stack.space));
          if (stack.encoding) head.append(el('span', 'tag', stack.encoding));
          card.append(head);

          const facts = [];
          if (Number.isFinite(stack.minzoom) && Number.isFinite(stack.maxzoom)) {
            facts.push(`z${stack.minzoom}–z${stack.maxzoom}`);
          }
          facts.push(
            `${stack.sources} source${stack.sources === 1 ? '' : 's'}`,
          );
          if (stack.format) facts.push(stack.format);
          card.append(el('p', 'facts', facts.join(' · ')));

          const links = el('div', 'links');
          const add = (href, text) => {
            const a = el('a', null, text);
            a.href = href;
            links.append(a);
          };
          const ends = stack.endpoints ?? {};
          // Same rule as the categories above: an address that belongs in a
          // style is copied, and a page is followed.
          if (ends.tileJson) copyButton(links, ends.tileJson, 'TileJSON');
          if (ends.xyz) copyButton(links, ends.xyz, 'XYZ');
          // Copied rather than followed: this address is for another node's
          // settings, not for reading here. A browser shown an RSS document
          // mostly offers to download it.
          if (ends.feed) copyButton(links, ends.feed, 'RSS');
          if (ends.preview) {
            if (drawsAsTerrain(stack)) {
              add(`${ends.preview}?raw=1`, 'preview');
              add(ends.preview, 'terrain');
            } else {
              add(ends.preview, 'preview');
            }
          }
          card.append(links);
          host.append(card);
        }
      };

      // Categories are the handle that survives a rebuild, so they go first —
      // a style should point at one of these rather than at an infohash.
      // Categories first, and given the same weight as an archive, because
      // for most visitors they are the more useful thing: an archive URL names
      // one build and goes stale on the next, while a category names whichever
      // is current and keeps working across rebuilds. A style should point at
      // one of these.
      const renderCategories = (categories) => {
        const host = document.getElementById('categories');
        host.textContent = '';
        const usable = categories.filter((c) => c.endpoints);
        if (usable.length === 0) return;

        host.append(el('h2', null, 'Categories'));
        host.append(
          el(
            'p',
            'facts',
            'These follow the newest build. Point a style at one of these ' +
              'rather than at an archive below, and it keeps working when the ' +
              'archive is rebuilt.',
          ),
        );

        for (const entry of usable) {
          // `category` and `archives` are what the endpoint actually calls
          // these; `name` and `count` would read better and are not there.
          const card = el('div', 'archive');
          const head = el('header');
          head.append(el('span', 'name', entry.category));
          if (Number.isFinite(entry.archives)) {
            head.append(
              el(
                'span',
                'tag',
                `${entry.archives} build${entry.archives === 1 ? '' : 's'}`,
              ),
            );
          }
          card.append(head);

          if (entry.newest?.name) {
            const facts = [`newest: ${entry.newest.name}`];
            const size = bytes(entry.newest.size);
            if (size) facts.push(size);
            card.append(el('p', 'facts', facts.join(' · ')));
          }

          const links = el('div', 'links');
          const add = (href, text) => {
            const a = el('a', null, text);
            a.href = href;
            links.append(a);
          };
          // What each endpoint is for decides how it is offered. A .torrent
          // is a file to fetch, so it stays a link the browser downloads; a
          // preview is a page to visit. The rest are addresses that belong
          // somewhere else — a style, a torrent client, a feed reader — and
          // following one here achieves nothing, so those copy.
          // `fetched` for an endpoint whose *answer* is the thing worth
          // having rather than its address. /magnet serves a magnet URI as
          // text/plain, and copying the URL of that handed somebody a link to
          // a magnet instead of a magnet — which a torrent client cannot open.
          const copy = (href, text, fetched) =>
            copyButton(links, href, text, fetched);

          const ends = entry.endpoints;
          if (ends.tileJson) copy(ends.tileJson, 'TileJSON');
          // The XYZ template beside the document that carries it. Anything
          // that takes a URL with braces in it rather than a TileJSON — a
          // Leaflet layer, an OpenLayers source, a GIS client — wants this
          // one, and it follows the category, so it survives a rebuild.
          if (ends.xyz) copy(ends.xyz, 'XYZ');
          // The newest build's preview, which is what "show me this
          // category" means.
          if (ends.preview) {
            if (drawsAsTerrain(entry.newest)) {
              add(`${ends.preview}?raw=1`, 'preview');
              add(ends.preview, 'terrain');
            } else {
              add(ends.preview, 'preview');
            }
          }
          // A file, so a link the browser saves rather than renders.
          if (ends.torrent) {
            const a = el('a', null, '.torrent');
            a.href = ends.torrent;
            a.download = '';
            links.append(a);
          }
          if (ends.magnet) copy(ends.magnet, 'magnet', true);
          if (ends.feed) copy(ends.feed, 'RSS');
          // The one worth copying and the one nobody wants to read: a TileJSON
          // URL carrying the .torrent URL and a percent-encoded magnet in its
          // fragment. Printed in full it was most of the card — several
          // hundred characters of it — and it is never read, only pasted.
          if (ends.sourceUrl) copy(ends.sourceUrl, 'source URL');
          card.append(links);

          host.append(card);
        }
      };
      const PMTILES_NS =
        'https://github.com/TechIdiots-LLC/pmtiles-swarm/ns/1.0';

      // The feed says the same things the catalog does, in RSS. It is the
      // fallback because it is the one that needs no credential: /api/catalog
      // is guarded whenever this node has any authentication configured, which
      // is most of them, and a front page that 401s is worse than none.
      const fromFeed = (xmlText) => {
        const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
          throw new Error('the feed is not valid XML');
        }

        const text = (item, name) =>
          item.getElementsByTagNameNS(PMTILES_NS, name)[0]?.textContent ??
          undefined;

        return [...doc.getElementsByTagName('item')].map((item) => {
          const zoom = (name) => {
            const value = Number(text(item, name));
            return Number.isFinite(value) ? value : undefined;
          };
          const enclosure = item.getElementsByTagName('enclosure')[0];
          const format = text(item, 'format');

          return {
            infoHash: text(item, 'infohash'),
            name: item.getElementsByTagName('title')[0]?.textContent,
            size: Number(enclosure?.getAttribute('length')) || undefined,
            categories: [...item.getElementsByTagName('category')].map(
              (node) => node.textContent,
            ),
            magnet: text(item, 'magnet'),
            createdAt: item.getElementsByTagName('pubDate')[0]?.textContent,
            pmtiles: format
              ? {
                  format,
                  minZoom: zoom('minzoom'),
                  maxZoom: zoom('maxzoom'),
                }
              : undefined,
          };
        });
      };

      // Held so the filter and the sort re-render from memory rather than
      // asking the node again on every keystroke.
      let loadedArchives = [];
      let loadedCategories = [];
      let loadedStacks = [];

      const matches = (text, needle) =>
        String(text ?? '')
          .toLowerCase()
          .includes(needle);

      const sorters = {
        name: (a, b) => String(a.name ?? '').localeCompare(String(b.name ?? '')),
        newest: (a, b) =>
          new Date(b.createdAt ?? 0) - new Date(a.createdAt ?? 0),
        largest: (a, b) => (b.size ?? 0) - (a.size ?? 0),
      };

      // The same three orderings against a category, which keeps its facts in a
      // different shape: its own name, and the build it currently points at.
      //
      // Sorting only the archives was the same thing as not sorting at all for
      // most visitors. Categories are the list worth reading -- they follow the
      // newest build, which is what a style should hold -- so they are rendered
      // first and are what somebody watches while changing the control. A node
      // carrying twenty of them and a handful of archives looked completely
      // unresponsive to it.
      const categorySorters = {
        name: (a, b) =>
          String(a.category ?? '').localeCompare(String(b.category ?? '')),
        newest: (a, b) =>
          new Date(b.newest?.createdAt ?? 0) - new Date(a.newest?.createdAt ?? 0),
        largest: (a, b) => (b.newest?.size ?? 0) - (a.newest?.size ?? 0),
      };

      // Re-renders both lists against the current filter and sort.
      const apply = () => {
        const needle = (document.getElementById('filter').value ?? '')
          .trim()
          .toLowerCase();
        const order = document.getElementById('sort').value;

        const archives = loadedArchives
          .filter(
            (archive) =>
              needle === '' ||
              matches(archive.name, needle) ||
              matches(archive.infoHash, needle) ||
              (archive.categories ?? []).some((c) => matches(c, needle)),
          )
          .sort(sorters[order] ?? sorters.name);

        const categories = loadedCategories
          .filter(
            (entry) =>
              needle === '' ||
              matches(entry.category, needle) ||
              matches(entry.newest?.name, needle),
          )
          .sort(categorySorters[order] ?? categorySorters.name);

        renderCategories(categories);
        renderStacks(loadedStacks);
        render(archives);

        const count = document.getElementById('count');
        count.textContent =
          needle === ''
            ? `${loadedArchives.length} archives, ${loadedCategories.length} categories`
            : `${archives.length} of ${loadedArchives.length} archives, ` +
              `${categories.length} of ${loadedCategories.length} categories`;
      };

      const load = async () => {
        let archives = null;

        // Richer where it is reachable: the catalog carries web seeds and the
        // sparse flag, which the feed does not.
        try {
          const response = await fetch('/api/catalog');
          if (response.ok) {
            archives = (await response.json()).archives ?? [];
          }
        } catch {
          // Fall through to the feed.
        }

        if (archives === null) {
          try {
            const response = await fetch('/feed.xml');
            if (!response.ok) throw new Error(`feed said ${response.status}`);
            archives = fromFeed(await response.text());
          } catch (error) {
            const host = document.getElementById('archives');
            host.textContent = '';
            host.append(
              el(
                'p',
                'failed',
                `Could not load the archives: ${error.message}`,
              ),
            );
            return;
          }
        }

        loadedArchives = archives.filter((archive) => archive.infoHash);
        document.getElementById('toolbar').hidden = false;
        apply();

        // /latest/ rather than /api/categories: the same list, without a
        // credential. This is the part most visitors actually want -- an
        // archive URL names one build, a category names whichever is current
        // -- so it is worth more than a best-effort attempt at a guarded
        // endpoint that answers 401 to exactly the audience this page is for.
        try {
          const response = await fetch('/latest/');
          if (response.ok) {
            const body = await response.json();
            loadedCategories = body.categories ?? [];
            apply();
          }
        } catch {
          // Nothing to say. The archives above are the substance.
        }

        // A stack has no infohash and appears in no feed, so this is the only
        // way a visitor finds out one is served at all.
        try {
          const response = await fetch('/stacks/');
          if (response.ok) {
            const body = await response.json();
            loadedStacks = body.stacks ?? [];
            apply();
          }
        } catch {
          // A node with no stacks answers this too, so a failure here means
          // something else and the page is still useful without it.
        }
      };

      document.getElementById('filter').addEventListener('input', apply);
      document.getElementById('sort').addEventListener('change', apply);

      load();
    </script>
  </body>
</html>
